a01: "<span>Hors-ligne</span><span>Aucune donnée envoyée</span><span>Sans compte</span>"
a02: "L'état des lieux <em>dans votre poche</em>, même sans réseau."
a03: "Entrée, sortie, photos, signatures et rapport PDF, directement sur votre téléphone. La sortie se compare toute seule à l'entrée."
a04: "Essayer la démo"
a05: "réseau nécessaire sur place"
a06: "donnée envoyée sur Internet"
a07: "1 tap"
a08: "par élément inspecté"
a09: "1 fois"
a10: "payé, pas d'abonnement obligatoire"
a11: "Vos données"
a12: "Rien ne part sur Internet. Tout reste dans votre téléphone."
a13: "La plupart des applications envoient vos états des lieux (noms, adresses, photos, signatures de vos locataires) sur leurs serveurs, quelque part « dans le cloud ». <strong>Pas la nôtre.</strong>"
a14: "Votre téléphone"
a15: "Toutes vos données sont ici"
a16: "Serveur, « cloud »"
a17: "Aucune donnée envoyée"
a18: "📱 Enregistré dans le téléphone"
a19: "Chaque logement, chaque photo, chaque signature est enregistrée dans la mémoire de votre téléphone, comme vos photos de vacances."
a20: "🚫 Aucun serveur, aucun compte"
a21: "Pas d'inscription, pas de mot de passe, pas de base de données chez nous. Nous ne pouvons pas voir vos données, même si nous le voulions."
a22: "✉️ Vous décidez de ce qui sort"
a23: "Le seul moment où un document quitte votre téléphone, c'est quand <strong>vous</strong> envoyez le rapport PDF, depuis votre propre messagerie."
a24: "Points forts"
a25: "Pensé pour le terrain, pas pour le bureau"
a26: "Beaucoup d'applications demandent un compte, une connexion et des crédits à racheter. La nôtre marche dans une cave, sans réseau, avec une seule main libre."
a27: "Comment ça marche"
a28: "De la visite à l'accord des deux parties"
a29: "<span class=\"etape-num\">1</span>\n        <h3>La visite, sur place</h3>\n        <p>Pièce par pièce, un tap par élément. Photos horodatées, compteurs, clés. Pour une sortie, l'état d'entrée s'affiche à côté de chaque élément.</p>"
a30: "<span class=\"etape-num\">2</span>\n        <h3>La signature</h3>\n        <p>Bailleur et locataire signent au doigt sur le téléphone. Heure et position GPS sont enregistrées, l'état des lieux est verrouillé.</p>"
a31: "<span class=\"etape-num\">3</span>\n        <h3>L'envoi et la confirmation</h3>\n        <p>Le rapport PDF est envoyé <strong>aux deux parties</strong>. Chacune <strong>répond au message</strong> : « Bien reçu, OK ». Cet échange daté vaut accusé de réception.</p>\n        <div class=\"mail-mock\">\n          <div class=\"mail-entete\"><strong>Re : État des lieux d'entrée — Studio centre-ville</strong><small>aujourd'hui, 18:42</small></div>\n          <p>Bien reçu, OK, je confirme l'état des lieux. 👍</p>\n        </div>"
a32: "<span class=\"etape-num\">4</span>\n        <h3>10 jours pour compléter</h3>\n        <p>Comme le prévoit la loi, le locataire dispose de <strong>10 jours</strong> pour demander à compléter l'état des lieux d'entrée (1<sup>er</sup> mois de chauffe pour le chauffage), par simple réponse écrite.</p>"
a33: "Signature : une démarche de bonne foi"
a34: "La signature au doigt est une <strong>signature électronique simple</strong> : elle n'est <strong>pas une signature certifiée</strong> (niveaux « avancé » ou « qualifié » eIDAS). Elle fonctionne dans une <strong>démarche de bonne foi</strong> entre bailleur et locataire, et constitue un élément de preuve renforcé par l'accusé de réception de chacun. En cas de conflit déjà ouvert, faites appel à un commissaire de justice."
