  - name: infos
    label: "ℹ️ Infos"
    editor: { preview: false }
    files:
      - name: infos
        label: Coordonnées et description
        file: data/infos.yaml
        fields:
          - { name: slogan, label: Slogan, widget: text }
          - { name: description, label: "Description (Google)", widget: text }
          - { name: email, label: E-mail de contact, widget: string }
          - { name: telephone, label: Téléphone, widget: string, required: false }
          - { name: raison_sociale, label: "Raison sociale", widget: string, required: false }
          - { name: siret, label: SIRET, widget: string, required: false }
          - { name: adresse, label: Adresse, widget: string, required: false }

  - name: legal
    label: "⚖️ Pages"
    editor: { preview: false }
    files:
      - { name: mentions, label: Mentions légales, file: content/mentions-legales.md, fields: &page [ { name: title, label: Titre, widget: string }, { name: description, label: "Description (Google)", widget: text, required: false }, { name: robots, widget: hidden, required: false }, { name: body, label: Texte, widget: markdown } ] }
      - { name: cgv, label: CGV, file: content/cgv.md, fields: *page }
      - { name: confidentialite, label: Confidentialité, file: content/confidentialite.md, fields: *page }
      - { name: merci, label: "Page « merci »", file: content/merci.md, fields: *page }
      - { name: blog, label: "Blog (en-tête)", file: content/blog/_index.md, fields: [ { name: title, label: Titre, widget: string }, { name: description, label: "Description (Google)", widget: text, required: false } ] }
