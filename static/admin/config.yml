# Decap CMS — https://etat-des-lieux.ananse.fr/admin/
# Chaque enregistrement crée un commit sur main : Cloudflare republie le site en 1 à 2 minutes.
backend:
  name: github
  repo: Ananse-agence-web/etat-des-lieux-offline
  branch: main
  base_url: https://www.ananse.fr
  auth_endpoint: api/auth

locale: fr
site_url: https://etat-des-lieux.ananse.fr
display_url: https://etat-des-lieux.ananse.fr
logo_url: https://etat-des-lieux.ananse.fr/images/logo.svg

media_folder: static/images/blog
public_folder: /images/blog

collections:
  - name: blog
    label: "📝 Guides (blog)"
    label_singular: article
    folder: content/blog
    create: true
    slug: "{{fields.slug}}"
    filter: { field: slug, pattern: "." }
    preview_path: "blog/{{slug}}/"
    sortable_fields: [date, title]
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: slug, label: "Adresse (slug)", widget: string, pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Minuscules, chiffres et tirets, sans accent"], hint: "Donne l'adresse /blog/mon-article/. Ne plus la changer une fois publiée." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { name: description, label: "Résumé (Google et cartes d'articles)", widget: text }
      - { name: tags, label: "Thèmes (ex. loi, checklist)", widget: list, required: false }
      - { name: draft, label: "Brouillon (non publié)", widget: boolean, default: false, required: false }
      - { name: body, label: Article, widget: markdown }

  - name: accueil
    label: "🏠 Page d'accueil"
    editor: { preview: false }
    files:
      - name: atouts
        label: Atouts
        file: data/atouts.yaml
        fields:
          - name: atouts
            label: Atouts
            widget: list
            summary: "{{titre}}"
            fields:
              - { name: icone, label: Icône, widget: select, options: [wifi-off, lock, tag, compare, zap, camera, pen, phone, shield, table, palette, mail-check] }
              - { name: titre, label: Titre, widget: string }
              - { name: texte, label: Texte, widget: text }
              - { name: vedette, label: "Mis en avant (grande carte)", widget: boolean, required: false }
      - name: tarifs
        label: Tarifs
        file: data/tarifs.yaml
        fields:
          - name: tarifs
            label: Offres
            widget: list
            summary: "{{nom}} — {{prix}} {{periode}}"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: nom, label: Nom, widget: string }
              - { name: prix, label: "Prix (ex. 5 €)", widget: string }
              - { name: periode, label: "Période (ex. / an)", widget: string, required: false }
              - { name: accroche, label: Accroche, widget: string }
              - { name: badge, label: Badge, widget: string, required: false }
              - { name: vedette, label: "Mise en avant", widget: boolean, required: false }
              - { name: inclus, label: Inclus, widget: list, field: { name: point, label: Point, widget: string } }
              - { name: bouton, label: "Texte du bouton", widget: string }
              - { name: lien, label: "Lien de paiement (clé dans hugo.toml, ne pas changer)", widget: string }
      - name: faq
        label: Questions fréquentes
        file: data/faq.yaml
        fields:
          - name: faq
            label: Questions
            widget: list
            summary: "{{q}}"
            fields:
              - { name: q, label: Question, widget: string }
              - { name: r, label: Réponse, widget: markdown, buttons: [bold, italic, link, bulleted-list], editor_components: [] }
      - name: textes
        label: "Tous les textes (accueil, menu, pied de page)"
